# Deploy IAIFI Paperscape to GitHub Pages
# Deploys Code/IAIFI/web/ directory to gh-pages branch on push to main.

name: Deploy IAIFI Paperscape

on:
  push:
    branches: [main]
    paths:
      - 'Code/IAIFI/web/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Code/IAIFI/web
