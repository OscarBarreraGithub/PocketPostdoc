# DEP.1: GitHub Pages deployment
# Deploys web/ directory to gh-pages branch on push to main.
# Target URL: abelclaw.github.io/iaifi-paperscape/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
